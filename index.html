<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atziri Temple Planner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🎯 Atziri Temple Planner</h1>
        <p class="instructions">Click on cells to place or remove rooms</p>

        <div class="main-layout">
            <div class="object-selector">
                <label>Select Room:</label>
                <div class="object-grid" id="object-grid"></div>
                <label>Special Rooms:</label>
                <div class="object-grid" id="special-object-grid"></div>
            </div>

            <div class="right-section">
                <div class="grid-wrapper">
                    <svg class="grid-connections" id="grid-connections"></svg>
                    <div class="grid" id="grid"></div>
                </div>
                <div class="tooltip" id="tooltip">

                </div>
            </div>
                            <div class="modifiers-section">
                    <h3>Modifiers</h3>
                    <div class="modifiers-table" id="modifiers-table"></div>
            </div>
        </div>

        <div class="controls">
            <button class="save-btn" onclick="showSaveModal()">Save Layout</button>
            <button class="load-btn" onclick="showLoadModal()">Load Layout</button>
            <button class="share-btn" onclick="shareLayout()">Share</button>
            <button class="export-btn" onclick="exportLayout()">Export JSON</button>
            <button class="import-btn" onclick="document.getElementById('import-file').click()">Import JSON</button>
            <input type="file" id="import-file" accept=".json" style="display: none" onchange="importLayout(event)">
            <button class="clear-btn" onclick="clearGrid()">Clear All</button>
        </div>
    </div>

    <!-- Modal for room picker -->
    <div class="modal" id="room-picker-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Select a Room</h2>
                <button class="modal-close" onclick="closeRoomPickerModal()">&times;</button>
            </div>
            <div class="modal-body" id="room-picker-grid"></div>
        </div>
    </div>

    <!-- Modal for saving layout -->
    <div class="modal" id="save-modal">
        <div class="modal-content modal-small">
            <div class="modal-header">
                <h2>Save Layout</h2>
                <button class="modal-close" onclick="closeSaveModal()">&times;</button>
            </div>
            <div class="modal-body">
                <label for="layout-name">Layout Name:</label>
                <input type="text" id="layout-name" placeholder="My Temple Layout" class="text-input">
                <div class="modal-actions">
                    <button class="btn-primary" onclick="saveLayout()">Save</button>
                    <button class="btn-secondary" onclick="closeSaveModal()">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal for loading layout -->
    <div class="modal" id="load-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Load Layout</h2>
                <button class="modal-close" onclick="closeLoadModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div id="saved-layouts-list" class="saved-layouts-list"></div>
            </div>
        </div>
    </div>

    <!-- Modal for sharing layout -->
    <div class="modal" id="share-modal">
        <div class="modal-content share-modal-content">
            <div class="modal-header">
                <h2>Share Layout</h2>
                <button class="modal-close" onclick="closeShareModal()">&times;</button>
            </div>
            <div class="modal-body">
                <p>Copy this link to share your layout:</p>
                <div class="share-url-container">
                    <input type="text" id="share-url" class="share-url-input" readonly>
                    <button id="share-copy-btn" class="share-copy-btn" onclick="copyShareUrl()">Copy</button>
                </div>
                <p style="font-size: 12px; color: #666; margin-top: 10px;">Anyone with this link can view and edit your layout.</p>
            </div>
        </div>
    </div>

    <script src="rooms.js"></script>
    <script src="modifiers.js"></script>
    <script src="upgrade-rules.js"></script>
    <script src="conversion-rules.js"></script>
    <script src="placement-rules.js"></script>
    <script src="layout-manager.js"></script>
    <script src="script.js"></script>
</body>
</html>
